name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install hurl
        run: |
          set -euo pipefail
          VERSION=8.0.1
          BASE=https://github.com/Orange-OpenSource/hurl/releases/download/$VERSION
          TARBALL=hurl-$VERSION-x86_64-unknown-linux-gnu.tar.gz
          curl --proto '=https' --tlsv1.2 -sSfL "$BASE/$TARBALL" -o "/tmp/$TARBALL"
          curl --proto '=https' --tlsv1.2 -sSfL "$BASE/$TARBALL.sha256" -o "/tmp/$TARBALL.sha256"
          echo "$(cat /tmp/$TARBALL.sha256)  /tmp/$TARBALL" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/$TARBALL" -C /tmp
          install -m 0755 "/tmp/hurl-$VERSION-x86_64-unknown-linux-gnu/bin/hurl" "$HOME/.local/bin/hurl"
          hurl --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run example integration tests
        run: make -C example/basic-auth test

  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: go mod tidy
        working-directory: firestore
      - name: Test firestore stores against the emulator
        run: npx -y firebase-tools emulators:exec --only firestore --project test-project "go test ./..."
        working-directory: firestore

  sqlstore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go mod tidy
        working-directory: sqlstore
      - name: Test sqlstore with in-memory sqlite
        run: go test ./...
        working-directory: sqlstore
