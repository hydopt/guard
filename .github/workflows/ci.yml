name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install hurl
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://sh.install.hurl.dev | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run example integration tests
        run: make -C example/basic-auth test
