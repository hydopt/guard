<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in</title>
	<style>
		:root {
			--bg: #f5f6f8;
			--card: #ffffff;
			--border: #e2e4e8;
			--text: #1f2328;
			--muted: #6a737d;
			--accent: #0969da;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: var(--bg);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			color: var(--text);
		}
		.card {
			width: min(420px, calc(100vw - 32px));
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 40px 36px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, .06);
		}
		h1 { margin: 0 0 8px; font-size: 22px; }
		.subtitle { margin: 0 0 28px; color: var(--muted); font-size: 14px; }
		ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
		a {
			display: block;
			text-align: center;
			padding: 12px 16px;
			border: 1px solid var(--border);
			border-radius: 8px;
			color: var(--text);
			background: var(--card);
			text-decoration: none;
			font-size: 15px;
			font-weight: 500;
			transition: border-color .15s ease, box-shadow .15s ease;
		}
		a:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(9, 105, 218, .15); }
	</style>
</head>
<body>
	<main class="card">
		<h1>Sign in</h1>
		<p class="subtitle">Choose your provider to continue.</p>
		<ul>
			{{range .Providers}}
			<li><a href="{{.StartPath}}">Continue with {{.Label}}</a></li>
			{{else}}
			<li><a href="/">No sign-in providers configured.</a></li>
			{{end}}
		</ul>
	</main>
</body>
</html>
